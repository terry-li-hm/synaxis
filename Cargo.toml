[package]
name = "synaxis"
version = "0.1.0"
edition = "2024"
description = "Sync AI coding tool config across Claude Code, OpenCode, Codex, and Gemini CLI — config-driven, single source of truth"
license = "MIT"
repository = "https://github.com/terry-li-hm/synaxis"
keywords = ["cli", "ai", "sync", "mcp", "claude"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "synaxis"
path = "src/main.rs"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
